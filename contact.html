<body>
    <nav>
        <a href="index.html">Home</a>

        <a href="contact.html">Contact</a>
    </nav> 
    <main>
        <ol>
        <!--Link for Email-->
        <li>Want to chat more? Email me!: <a href="nsomersel@albany.edu"> School Email</a></li>
        <!--External absolute link-->
        <li>Check this out!: <a href="https://github.com/NicoleSomersel" target="_blank">My own Blog (Link is my github for now till i get it set up lol)</a></li>
        </ol>
        <!--Form! I might use this in my own personal site tbh as a guestbook of sorts. Maybe in future make it more forum like where questions that have been answered will show?-->
    <div class="content">
        <form action="#" method="post">
            <fieldset>
                <legend>Message board</legend>
                <p>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>
                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </p>

                <p>
                    <label for="reason">Reason for Contacting Me:</label>
                    <select id="reason" name="reason">
                        <option value="question">Questions</option>
                        <option value="Tech Support">Tech Support</option>
                        <option value="Feedback">Feedback</option>
                        <option value="Other">Other concerns</option>
                    </select>
                </p>

                <p>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4"></textarea>
                </p>

                <p>
                    <input type="checkbox" id="updates" name="updates">
                    <label for="updates"> Come Email me about future updates to this site</label>
                </p>
                <button type="submit">Send</button>
        </form>
    </main>
